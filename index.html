<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Chris Westergaard</title>
  <meta name="description" content="How to reach Chris Westergaard: email, X, Instagram, Threads, and Venmo." />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f7f7f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)" />
  <!-- Icons: Font Awesome Free (fontawesome.com), CC BY 4.0, inlined as SVG. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --page: #f7f7f7;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #666666;
      --faint: #767676;
      --rule: #e9e9e9;
      --banner: #f4f4f5;
      --banner-hover: #ebebed;
      --banner-border: #e6e6e8;
      --shadow: 0 4px 24px rgba(0,0,0,0.08);
      --c-email: #2c6fdf;  --bg-email: #e4ecff;
      --c-x: #000000;      --bg-x: #e6e6e8;
      --c-ig: #c13584;     --bg-ig: #ffe6f1;
      --c-threads: #1a1a1a; --bg-threads: #e9e6fb;
      --c-venmo: #008cff;  --bg-venmo: #e0f1ff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111214;
        --card: #1b1c1f;
        --text: #f2f2f3;
        --muted: #a9abb1;
        --faint: #8b8d94;
        --rule: #2c2d31;
        --banner: #25262a;
        --banner-hover: #2f3035;
        --banner-border: #34353a;
        --shadow: 0 4px 24px rgba(0,0,0,0.4);
        --c-email: #8fb4ff;  --bg-email: #1f2c47;
        --c-x: #ffffff;      --bg-x: #36373c;
        --c-ig: #ff8cc6;     --bg-ig: #40203a;
        --c-threads: #ffffff; --bg-threads: #322e4a;
        --c-venmo: #6fc0ff;  --bg-venmo: #17304a;
      }
    }

    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--page);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding:
        max(24px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(40px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      box-shadow: var(--shadow);
      max-width: 480px;
      width: 100%;
      padding: 32px 20px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Profile ── */
    .photo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--banner);
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      text-align: center;
      margin-bottom: 8px;
    }

    .bio {
      font-size: 0.95rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: 32px;
    }

    /* ── Sections ── */
    .section { width: 100%; }

    .section-title {
      text-align: center;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--faint);
      margin-bottom: 16px;
    }

    .divider {
      width: 100%;
      height: 1px;
      border: 0;
      background: var(--rule);
      margin: 28px 0;
    }

    .work-role {
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 16px;
      text-wrap: balance;
    }

    .work-role strong {
      display: block;
      font-size: 0.95rem;
      color: var(--text);
      font-weight: 600;
    }

    /* ── Banner links ── */
    .banners {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .banner {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 64px;
      padding: 10px 14px;
      border-radius: 14px;
      background: var(--banner);
      border: 1px solid var(--banner-border);
      color: var(--text);
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.18s, transform 0.15s, border-color 0.18s;
    }

    .banner-icon {
      flex: 0 0 44px;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--icon-bg);
      color: var(--icon-fg);
    }

    .banner-icon svg { width: 20px; height: 20px; display: block; }

    /* Text is centred on the banner as a whole: the right margin
       mirrors the icon tile (44px) plus the gap (14px). */
    .banner-text {
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-width: 0;
      margin-right: 58px;
      text-align: center;
      line-height: 1.3;
    }

    .banner-label { font-size: 1rem; font-weight: 600; }

    .banner-handle {
      font-size: 0.875rem;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .banner.email     { --icon-fg: var(--c-email);   --icon-bg: var(--bg-email); }
    .banner.x         { --icon-fg: var(--c-x);       --icon-bg: var(--bg-x); }
    .banner.instagram { --icon-fg: var(--c-ig);      --icon-bg: var(--bg-ig); }
    .banner.threads   { --icon-fg: var(--c-threads); --icon-bg: var(--bg-threads); }
    .banner.venmo     { --icon-fg: var(--c-venmo);   --icon-bg: var(--bg-venmo); }

    .banner:active { background: var(--banner-hover); transform: scale(0.985); }

    .banner:focus-visible {
      outline: 3px solid var(--c-email);
      outline-offset: 2px;
    }

    @media (hover: hover) {
      .banner:hover {
        background: var(--banner-hover);
        border-color: var(--icon-fg);
        transform: translateY(-1px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .banner { transition: none; }
      .banner:hover, .banner:active { transform: none; }
    }

    /* Larger screens: more breathing room */
    @media (min-width: 520px) {
      body { padding-top: 48px; padding-bottom: 64px; }
      .card { padding: 40px 32px 36px; }
    }

    /* Phones: no mirror margin, so the long work address stays on one line;
       text centres in the space beside the icon */
    @media (max-width: 480px) {
      .banner-text { margin-right: 0; }
    }

    /* Narrow phones (320px class): keep addresses on one line */
    @media (max-width: 360px) {
      .card { padding: 28px 12px 24px; }
      .banner { gap: 10px; padding: 10px; }
      .banner-icon { flex-basis: 40px; width: 40px; height: 40px; }
      .banner-handle { font-size: 0.78rem; }
    }

    /* Phones in landscape: tighten the header so links are reachable */
    @media (max-height: 480px) and (orientation: landscape) {
      .photo { width: 80px; height: 80px; margin-bottom: 12px; }
      .bio { margin-bottom: 20px; }
    }
  </style>
</head>
